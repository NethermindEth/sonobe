name: CI Check
on:
  merge_group:
  pull_request:
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  SSH_AUTH_SOCK: /tmp/ssh_agent.sock

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature_set: [basic]
        include:
          - feature_set: basic
            features: --features default,light-test
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
      - uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: 0.36.0
      - name: Use ssh-agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --release --workspace --no-default-features ${{ matrix.features }}
      - name: Run Doc-tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --doc

  examples:
    if: github.event.pull_request.draft == false
    name: Run examples & examples tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
      - uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: 0.36.0
      - name: Use ssh-agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Run examples tests
        run: cargo test --examples
      - name: Run all examples
        run: |
          for f in $(ls examples/*.rs); do
            name=$(basename "$f" .rs)
            echo "Running example: $name"
            cargo run --release --example "$name"
          done

  bench:
    if: github.event.pull_request.draft == false
    name: Bench compile
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - name: Use ssh-agent
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - uses: actions-rs/cargo@v1
        with:
          command: bench
          args: -p folding-schemes --no-run

  fmt:
    if: github.event.pull_request.draft == false
    name: Rustfmt
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
      - uses: Swatinem/rust-cache@v2
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all --check

  clippy:
    if: github.event.pull_request.draft == false
    name: Clippy lint checks (basic)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        feature_set: [basic]
        include:
          - feature_set: basic
            features: --features default
    steps:
      - uses: actions/checkout@v2
      - uses: actions-rs/toolchain@v1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: --no-default-features ${{ matrix.features }} -- -D warnings

  typos:
    if: github.event.pull_request.draft == false
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use typos with config file
        uses: crate-ci/typos@master
        with:
          config: .github/workflows/typos.toml
